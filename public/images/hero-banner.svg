<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice" width="1600" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#051424"/>
      <stop offset="0.45" stop-color="#0a1f33"/>
      <stop offset="1" stop-color="#122131"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00dbe9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00dbe9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1c2b3c"/>
    </pattern>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#dots)" opacity="0.5"/>

  <!-- ambient glows -->
  <circle cx="320" cy="180" r="260" fill="url(#glowCyan)"/>
  <circle cx="1280" cy="360" r="300" fill="url(#glowBlue)"/>
  <circle cx="900" cy="120" r="180" fill="url(#glowCyan)" opacity="0.7"/>

  <!-- neural network connections -->
  <g stroke="#00dbe9" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <line x1="180" y1="140" x2="360" y2="250"/>
    <line x1="360" y1="250" x2="520" y2="120"/>
    <line x1="360" y1="250" x2="560" y2="380"/>
    <line x1="520" y1="120" x2="720" y2="220"/>
    <line x1="560" y1="380" x2="760" y2="300"/>
    <line x1="720" y1="220" x2="900" y2="140"/>
    <line x1="760" y1="300" x2="980" y2="380"/>
    <line x1="900" y1="140" x2="1100" y2="240"/>
    <line x1="980" y1="380" x2="1180" y2="280"/>
    <line x1="1100" y1="240" x2="1320" y2="160"/>
    <line x1="1180" y1="280" x2="1400" y2="360"/>
    <line x1="1320" y1="160" x2="1460" y2="260"/>
    <line x1="720" y1="220" x2="760" y2="300"/>
    <line x1="1100" y1="240" x2="1180" y2="280"/>
  </g>
  <g stroke="#3b82f6" stroke-opacity="0.28" stroke-width="1" fill="none">
    <line x1="120" y1="320" x2="300" y2="200"/>
    <line x1="300" y1="200" x2="480" y2="420"/>
    <line x1="480" y1="420" x2="680" y2="180"/>
    <line x1="680" y1="180" x2="880" y2="420"/>
    <line x1="880" y1="420" x2="1080" y2="180"/>
    <line x1="1080" y1="180" x2="1280" y2="400"/>
    <line x1="1280" y1="400" x2="1480" y2="200"/>
  </g>

  <!-- nodes -->
  <g fill="#7df4ff">
    <circle cx="180" cy="140" r="4"/>
    <circle cx="360" cy="250" r="5.5"/>
    <circle cx="520" cy="120" r="4"/>
    <circle cx="560" cy="380" r="4.5"/>
    <circle cx="720" cy="220" r="6"/>
    <circle cx="760" cy="300" r="4.5"/>
    <circle cx="900" cy="140" r="5"/>
    <circle cx="980" cy="380" r="4.5"/>
    <circle cx="1100" cy="240" r="6"/>
    <circle cx="1180" cy="280" r="4.5"/>
    <circle cx="1320" cy="160" r="5"/>
    <circle cx="1400" cy="360" r="4"/>
    <circle cx="1460" cy="260" r="4.5"/>
  </g>
  <g fill="#00dbe9" filter="url(#soft)" opacity="0.6">
    <circle cx="360" cy="250" r="9"/>
    <circle cx="720" cy="220" r="10"/>
    <circle cx="1100" cy="240" r="10"/>
  </g>

  <!-- particles -->
  <g fill="#7df4ff" opacity="0.5">
    <circle cx="240" cy="90" r="1.5"/>
    <circle cx="430" cy="200" r="1.5"/>
    <circle cx="640" cy="60" r="1.5"/>
    <circle cx="820" cy="330" r="1.5"/>
    <circle cx="1010" cy="80" r="1.5"/>
    <circle cx="1230" cy="120" r="1.5"/>
    <circle cx="1370" cy="300" r="1.5"/>
    <circle cx="150" cy="260" r="1.5"/>
    <circle cx="560" cy="440" r="1.5"/>
    <circle cx="1260" cy="440" r="1.5"/>
  </g>

  <!-- bottom fade for text legibility -->
  <rect x="0" y="300" width="1600" height="200" fill="#051424" opacity="0.55"/>
</svg>
