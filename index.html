<!DOCTYPE html><html class="dark" lang="zh-CN" style=""><head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>AI NEXUS - 发现未来的AI工具</title>
<meta name="description" content="AI NEXUS是一个AI工具导航网站，为你精选全球最优质的AI工具，涵盖写作、创意、办公、图形处理等多个领域。">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<style>
  body { font-family: 'Roboto', sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 4px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  .bg-surface-container-low { background-color: rgba(255,255,255,0.03); }
  .text-primary-fixed-dim { color: #60a5fa; }
  .text-on-surface-variant { color: rgba(255,255,255,0.6); }
</style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen">

<!-- Header -->
<header class="sticky top-0 z-50 bg-[#0a0a0a]/95 backdrop-blur-md border-b border-white/5">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-primary-fixed-dim text-2xl">hub</span>
      <span class="text-xl font-bold text-primary-fixed-dim">AI NEXUS</span>
    </div>
    <nav class="hidden md:flex items-center gap-6">
      <a href="#" class="text-sm font-medium hover:text-primary-fixed-dim transition-colors">BLOG</a>
      <button class="bg-primary-fixed-dim hover:bg-blue-400 text-white px-4 py-1.5 rounded-full text-sm font-medium transition-colors">SUBMIT TOOL</button>
      <a href="#" class="text-sm font-medium hover:text-primary-fixed-dim transition-colors">CONTACT US</a>
    </nav>
    <button class="md:hidden material-symbols-outlined text-white">menu</button>
  </div>
</header>

<!-- Hero Section -->
<section class="relative py-12 px-4 overflow-hidden">
  <div class="absolute inset-0 bg-gradient-to-br from-blue-900/20 via-transparent to-purple-900/20"></div>
  <div class="relative max-w-7xl mx-auto">
    <div class="flex items-center gap-3 mb-4">
      <span class="bg-primary-fixed-dim/20 text-primary-fixed-dim px-3 py-1 rounded-full text-xs font-medium">EDITOR'S PICK</span>
      <span class="text-sm text-on-surface-variant">精选AI工具推荐</span>
    </div>
    <h1 class="text-4xl md:text-5xl font-bold mb-4">发现未来的AI工具</h1>
    <p class="text-lg text-on-surface-variant mb-8 max-w-2xl">探索全球最顶尖的人工智能工具，从创意设计到办公效率，助力你的每一个创意。</p>
    <button class="bg-primary-fixed-dim hover:bg-blue-400 text-white px-6 py-2.5 rounded-full text-sm font-medium transition-colors">TRY NOW</button>
  </div>
</section>

<!-- Category Grid -->
<section class="py-12 px-4">
  <div class="max-w-7xl mx-auto">
    <h2 class="text-2xl font-bold mb-8">AI工具分类排行榜</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4">
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="bg-[#0a0a0a] border-t border-white/5 py-8 mt-12">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary-fixed-dim">hub</span>
        <span class="text-lg font-bold text-primary-fixed-dim">AI NEXUS</span>
      </div>
      <div class="text-sm text-on-surface-variant">
        © 2024 AI NEXUS. All rights reserved.
      </div>
    </div>
  </div>
</footer>

<script>
  document.querySelectorAll('.category-card').forEach(card => {
    card.addEventListener('mouseenter', () => card.style.border = '1px solid rgba(96, 165, 250, 0.3)');
    card.addEventListener('mouseleave', () => card.style.border = 'none');
  });
</script>
</body>
</html>
